# .github/workflows/main.yml
# Đặt file này tại: <repo>/.github/workflows/main.yml
# Build tweak Theos trên macOS runner, tạo file .deb và upload làm artifact.
# Makefile nằm ở gốc repo nên project = "." (build từ thư mục gốc).

name: Build tweak

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        # "." = Makefile nằm ở gốc repo.
        # Nếu tweak nằm trong thư mục con, đổi thành tên thư mục đó, ví dụ: VSDumpHeaders
        project: ['.']

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cài Theos
        run: |
          if [ ! -d "$HOME/theos" ]; then
            git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          fi
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Cài iOS SDK
        run: |
          git clone --depth 1 https://github.com/theos/sdks.git /tmp/sdks
          mkdir -p "$HOME/theos/sdks"
          cp -R /tmp/sdks/*.sdk "$HOME/theos/sdks/"
          ls "$HOME/theos/sdks"

      - name: Cài ldid (để ký tweak)
        run: |
          brew install ldid
          ldid -v 2>&1 | head -1 || true

      - name: Build package
        working-directory: ${{ matrix.project }}
        run: |
          make clean
          make package FINALPACKAGE=1

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: deb
          path: packages/*.deb
          if-no-files-found: error

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: dylib
          path: .theos/obj/*.dylib
          if-no-files-found: error
